<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Daftar - Cloud Storage</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <main class="auth-page">

        <div class="auth-card">

            <a
                href="index.html"
                class="brand"
            >
                Cloud Storage
            </a>


            <h1>
                Buat akun
            </h1>


            <p>
                Daftar untuk mulai menyimpan file.
            </p>


            <form id="registerForm">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="nama@email.com"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Minimal 6 karakter"
                    minlength="6"
                    required
                >


                <button
                    type="submit"
                    class="btn btn-primary btn-large"
                >
                    Daftar
                </button>

            </form>


            <p
                id="registerMessage"
                class="auth-message"
            ></p>


            <p class="auth-footer">

                Sudah punya akun?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>

</body>

</html>
