<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cloud Storage</title>
    <script>
        (function () {
            const savedTheme = localStorage.getItem("theme");
            const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
            document.documentElement.setAttribute("data-theme", savedTheme || (prefersDark ? "dark" : "light"));
        })();
    </script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="auth-page">
        <button type="button" id="themeToggle" class="btn btn-outline theme-toggle auth-theme-toggle" aria-label="Ubah ke mode gelap" title="Mode Gelap">🌙</button>
        <div class="auth-card">
            <a href="index.html" class="brand">Cloud Storage</a>
            <h1>Selamat datang kembali</h1>
            <p>Login untuk mengakses file kamu.</p>
            <form id="loginForm">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="nama@email.com" required>
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit" class="btn btn-primary btn-large">Login</button>
            </form>
            <p class="auth-footer">
                Belum punya akun? <a href="register.html">Daftar</a>
            </p>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
